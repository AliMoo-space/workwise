name: workwise

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.8

  flutter:
    sdk: flutter

  flutter_screenutil_plus: ^1.5.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
