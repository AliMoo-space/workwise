name: workwise

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  animated_toggle_switch: ^0.8.7
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.8
  file_picker: ^10.3.10
  fl_chart: ^1.2.0

  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1

  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_native_splash: ^2.4.8

  flutter_screenutil_plus: ^1.5.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^17.3.0

  image_picker: ^1.2.3
  intl: ^0.20.2
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  lottie: ^3.5.1
  percent_indicator: ^4.2.5
  pinput: ^6.0.2
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  shimmer_animation: ^2.2.2+1
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.15.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter



flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic


  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro-Regular.ttf
  #       - asset: fonts/TrajanPro-Regular.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  assets:
    - assets/images/

flutter_native_splash:
  color: "#ffffff" # اللون اللي اخترته (شيلنا 0xFF وحطينا #)
  image: assets/images/e.png # مسار الصورة

  android_12:
    image: assets/images/e.png
    color: "#ffffff"

  web: false


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_app.png"