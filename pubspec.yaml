  provider: ^6.1.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.0

  flutter_localizations:
    sdk: flutter

  shimmer_animation: ^2.2.2+1
  file_picker: ^10.3.10
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  image_picker: ^1.2.3
