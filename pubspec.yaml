name: workwise
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil_plus: ^1.5.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
  lottie: ^3.5.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.15.0
  flutter_localizations:
    sdk: flutter
  shimmer_animation: ^2.2.2+1
  image_picker: ^1.2.3
  percent_indicator: ^4.2.5
